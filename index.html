<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUDSAN POS</title>

<style>
.status-btn{

width:100%;

padding:18px;

font-size:22px;

font-weight:bold;

background:#ff6b35;

color:white;

border:none;

border-radius:12px;

}
body{
font-family:Tahoma,sans-serif;
margin:0;
background:#f5f5f5;
}

header{
background:#ff6b35;
color:white;
padding:15px;
font-size:24px;
font-weight:bold;
text-align:center;
}

.tabs{
display:flex;
background:white;
}

.tab{
flex:1;
padding:12px;
border:none;
cursor:pointer;
font-size:16px;
background:white;
}

.active{
background:#ff6b35;
color:white;
}

.page{
display:none;
padding:15px;
}

.show{
display:block;
}

.menu-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:10px;
}

.menu-card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.15);
cursor:pointer;
text-align:center;
}

.cart-box{
background:white;
padding:15px;
border-radius:10px;
margin-top:15px;
}

.cart-row{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #eee;
}

button{
cursor:pointer;
}

.qty-btn{
width:32px;
height:32px;
margin:2px;
}

.save{
background:green;
color:white;
padding:10px;
border:none;
border-radius:6px;
}

.clear{
background:red;
color:white;
padding:10px;
border:none;
border-radius:6px;
}

.queue-card{
background:white;
padding:10px;
margin-bottom:10px;
border-radius:10px;
}

.stat{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:10px;
}
</style>
</head>
<body>

<header>KUDSAN POS</header>

<div class="tabs">
<button class="tab active" onclick="openPage(event,'order')">รับออเดอร์</button>
<button class="tab" onclick="openPage(event,'queue')">คิวชง</button>
<button class="tab" onclick="openPage(event,'history')">ประวัติ</button>
<button class="tab" onclick="openPage(event,'dashboard')">Dashboard</button>
</div>

<div id="order" class="page show">

<h2>เลือกเมนู</h2>

<div class="menu-grid" id="menuGrid"></div>
<div class="cart-box">

<h3>รายละเอียดออเดอร์</h3>

<p>ความหวาน</p>
<select id="sweetness">
<option value="0%">0%</option>
<option value="25%">25%</option>
<option value="50%">50%</option>
<option value="75%">75%</option>
<option value="100%" selected>100%</option>
</select>

<p>ท็อปปิ้ง</p>
<select id="topping">
<option value="ไม่ใส่|0">ไม่ใส่</option>
<option value="ไข่มุก|10">ไข่มุก +10</option>
<option value="ชีส|15">ชีส +15</option>
<option value="วิปครีม|15">วิปครีม +15</option>
<option value="บุก|10">บุก +10</option>
</select>

<p>รูปแบบการเสิร์ฟ</p>
<select id="serveType">
<option>พร้อมดื่ม</option>
<option>แยกน้ำ</option>
</select>

<p>ประเภทออเดอร์</p>
<select id="orderType">
<option>หน้าร้าน</option>
<option>เดลิเวอรี่</option>
</select>

<p>หมายเหตุ</p>
<textarea
id="note"
rows="3"
style="width:100%;">
</textarea>

</div>

<div class="cart-box">

<h3>รายการสินค้า</h3>

<div id="cart"></div>

<h2>รวม: <span id="total">0</span> บาท</h2>

<button class="save" onclick="saveOrder()">
บันทึกออเดอร์
</button>

<button class="clear" onclick="clearCart()">
ล้างรายการ
</button>

</div>

</div>

<div id="queue" class="page">
<h2>คิวชง</h2>
<div id="queueList"></div>
</div>

<div id="history" class="page">
<h2>ประวัติออเดอร์</h2>
<div id="historyList"></div>
</div>

<div id="dashboard" class="page">

<h2>Dashboard</h2>

<div class="stat">
<div class="stat">
📅 ออเดอร์วันนี้
<h3 id="todayOrders">0</h3>
</div>

<div class="stat">
💵 ยอดขายวันนี้
<h3 id="todaySales">0 บาท</h3>
</div>
💰 ยอดขายทั้งหมด
<h3 id="sales">0 บาท</h3>
</div>

<div class="stat">
🥤 จำนวนแก้วทั้งหมด
<h3 id="cups">0 แก้ว</h3>
</div>

<div class="stat">
🏆 เมนูขายดี
<div id="topMenus"></div>
</div>

</div>

<script>

const menus = [
{name:'ชาไทย',price:50},
{name:'ชาเขียว',price:50},
{name:'ชาพีช',price:45},
{name:'นมสด',price:45},
{name:'โกโก้',price:55},
{name:'Americano',price:50},
{name:'Latte',price:55}
];

let cart=[];

function openPage(evt,page){

document.querySelectorAll('.page')
.forEach(p=>p.classList.remove('show'));

document.querySelectorAll('.tab')
.forEach(t=>t.classList.remove('active'));

document.getElementById(page)
.classList.add('show');

if(evt){
evt.target.classList.add('active');
}

if(page==="queue") loadQueue();
if(page==="history") loadHistory();
if(page==="dashboard") loadDashboard();
}

function renderMenus(){

let html='';

menus.forEach(menu=>{

html += `
<div class="menu-card"
onclick="addMenu('${menu.name}',${menu.price})">

<h3>${menu.name}</h3>
<p>${menu.price} บาท</p>

</div>
`;

});

document.getElementById('menuGrid').innerHTML=html;

}

function addMenu(name,price){

const sweetness =
document.getElementById("sweetness").value;

const toppingRaw =
document.getElementById("topping").value;

const toppingName =
toppingRaw.split("|")[0];

const toppingPrice =
parseInt(
toppingRaw.split("|")[1]
);

const serveType =
document.getElementById("serveType").value;

const orderType =
document.getElementById("orderType").value;

const note =
document.getElementById("note").value;

cart.push({

name:name,

price:price,

sweetness:sweetness,

topping:toppingName,

toppingPrice:toppingPrice,

serveType:serveType,

orderType:orderType,

note:note,

qty:1

});

renderCart();

}


function renderCart(){

let html='';
let total=0;

cart.forEach((item,index)=>{

total +=
(item.price + item.toppingPrice)
* item.qty;

html += `
<div class="cart-row">

<div>
<b>${item.name}</b><br>
${item.price} บาท

<br>

หวาน :
${item.sweetness}

<br>

ท็อปปิ้ง :
${item.topping}

<br>

เสิร์ฟ :
${item.serveType}

<br>

ประเภท :
${item.orderType}

<br>

หมายเหตุ :
${item.note || '-'}
</div>

<div>

<button class="qty-btn"
onclick="decreaseItem(${index})">-</button>

${item.qty}

<button class="qty-btn"
onclick="increaseItem(${index})">+</button>

<button
onclick="removeItem(${index})">
🗑
</button>

</div>

</div>
`;

});

document.getElementById('cart').innerHTML=html;
document.getElementById('total').innerText=total;

}

function increaseItem(i){
cart[i].qty++;
renderCart();
}

function decreaseItem(i){

cart[i].qty--;

if(cart[i].qty<=0){
cart.splice(i,1);
}

renderCart();

}

function removeItem(i){

cart.splice(i,1);

renderCart();

}

function clearCart(){

cart=[];

renderCart();

}

function saveOrder(){

if(cart.length===0){
alert('ยังไม่มีรายการ');
return;
}

let orders=
JSON.parse(
localStorage.getItem('orders') || '[]'
);

orders.push({

orderNo:
'ORD-'+
String(orders.length+1)
.padStart(4,'0'),

time:new Date().toLocaleString('th-TH'),

status:'รอชง',

items:[...cart]

});

localStorage.setItem(
'orders',
JSON.stringify(orders)
);

alert('บันทึกสำเร็จ');

cart=[];

renderCart();

}

function loadQueue(){

let orders=
JSON.parse(
localStorage.getItem('orders') || '[]'
);

let html='';

orders.forEach((o,index)=>{

if(o.status==='เสร็จแล้ว'){
return;
}

html += `
<div class="queue-card">

<h3>${o.orderNo}</h3>

${o.time}

<br><br>

${o.items.map(i=>`

${i.name}
x${i.qty}

<br>

หวาน :
${i.sweetness}

<br>

ท็อปปิ้ง :
${i.topping}

<br>

เสิร์ฟ :
${i.serveType}

<br>

ประเภท :
${i.orderType}

<br>

หมายเหตุ :
${i.note}

`
).join('<br><br>')}

<br><br>

${o.status}

<br><br>

<button
class="status-btn"
onclick="nextStatus(${index})">

${o.status==="รอชง"
?
"เริ่มชง"
:
"เสร็จแล้ว"}

</button>


</div>
`;

});

document.getElementById('queueList').innerHTML =
html || 'ไม่มีคิว';

}

function nextStatus(index){

let orders=
JSON.parse(
localStorage.getItem('orders') || '[]'
);

if(orders[index].status==='รอชง'){

orders[index].status='กำลังชง';

}else{

orders[index].status='เสร็จแล้ว';

}

localStorage.setItem(
'orders',
JSON.stringify(orders)
);

loadQueue();

}

function loadHistory(){

let orders=
JSON.parse(
localStorage.getItem('orders') || '[]'
);

let html='';

orders
.filter(x=>x.status==='เสร็จแล้ว')
.reverse()
.forEach(o=>{

html += `
<div class="queue-card">
<h3>${o.orderNo}</h3>

${o.time}

<br><br>

${o.items.map(i=>

i.name+" x"+i.qty

).join("<br>")}

<br><br>

<button
onclick="viewOrder(${orders.indexOf(o)})">

ดู

</button>

<button
onclick="restoreOrder(${orders.indexOf(o)})">

แก้ไข

</button>

<button
onclick="deleteOrder(${orders.indexOf(o)})">

ลบ

</button>
</div>
`;

});

document.getElementById('historyList').innerHTML =
html || 'ยังไม่มีประวัติ';

}

function loadDashboard(){

const today =
new Date().toLocaleDateString();

let orders =
JSON.parse(
localStorage.getItem('orders') || '[]'
);

let cups=0;
let sales=0;
let todaySales=0;
let todayOrders=0;

let stats={};

orders.forEach(order=>{

const orderDate =
new Date(order.time)
.toLocaleDateString();

if(orderDate===today){

todayOrders++;

}

order.items.forEach(item=>{

cups += item.qty;

sales +=
item.qty *
(
item.price +
(item.toppingPrice || 0)
);

if(orderDate===today){

todaySales +=
item.qty *
(
item.price +
(item.toppingPrice || 0)
);

}

stats[item.name] =
(stats[item.name] || 0)
+ item.qty;

});

});

document.getElementById(
'todayOrders'
).innerText=
todayOrders+' ออเดอร์';

document.getElementById(
'todaySales'
).innerText=
todaySales+' บาท';

document.getElementById('cups')
.innerText=
cups+' แก้ว';

document.getElementById('sales')
.innerText=
sales+' บาท';

let html='';

Object.entries(stats)
.sort((a,b)=>b[1]-a[1])
.forEach(item=>{

html += `
<div>
${item[0]} :
${item[1]} แก้ว
</div>
`;

});

document.getElementById(
'topMenus'
).innerHTML =
html || 'ยังไม่มีข้อมูล';

}

document.getElementById('cups').innerText =
cups+' แก้ว';

document.getElementById('sales').innerText =
sales+' บาท';

document.getElementById(
"todayOrders"
).innerText =
todayOrders + " ออเดอร์";

document.getElementById(
"todaySales"
).innerText =
todaySales + " บาท";

document.getElementById('topMenus').innerHTML =
html || 'ยังไม่มีข้อมูล';

}

const today =
new Date()
.toLocaleDateString();
let orders=
JSON.parse(
localStorage.getItem('orders') || '[]'
);

let cups=0;
let sales=0;

let stats={};

orders.forEach(order=>{

const orderDate=
new Date(order.time)
.toLocaleDateString();

if(orderDate===today){

todayOrders++;

}

order.items.forEach(item=>{

cups+=item.qty;
sales+=
item.qty*
(item.price+
(item.toppingPrice||0));

if(orderDate===today){

todaySales+=
item.qty*
(item.price+
(item.toppingPrice||0));

}

stats[item.name]=
(stats[item.name]||0)+item.qty;

});

});

document.getElementById('cups').innerText =
cups+' แก้ว';

document.getElementById('sales').innerText =
sales+' บาท';

let html='';

Object.entries(stats)
.sort((a,b)=>b[1]-a[1])
.forEach(item=>{

html += `
<div>
${item[0]}
:
${item[1]} แก้ว
</div>
`;

});

document.getElementById('topMenus').innerHTML =
html || 'ยังไม่มีข้อมูล';

}
function viewOrder(index){

let orders=
JSON.parse(
localStorage.getItem("orders") ||
"[]"
);

alert(
JSON.stringify(
orders[index],
null,
2
)
);

}

function restoreOrder(index){

let orders=
JSON.parse(
localStorage.getItem("orders") ||
"[]"
);

orders[index].status="กำลังชง";

localStorage.setItem(
"orders",
JSON.stringify(orders)
);

loadHistory();

}

function deleteOrder(index){

if(!confirm("ลบออเดอร์ ?")){
return;
}

let orders=
JSON.parse(
localStorage.getItem("orders") ||
"[]"
);

orders.splice(index,1);

localStorage.setItem(
"orders",
JSON.stringify(orders)
);

loadHistory();

}
renderMenus();
renderCart();

</script>

</body>
</html>
