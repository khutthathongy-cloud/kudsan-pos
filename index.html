<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KUDSAN POS</title>

<style>

.category-container{

display:flex;
flex-wrap:wrap;
gap:8px;
margin-bottom:15px;

}

.category-btn{

padding:12px 20px;

font-size:18px;

font-weight:bold;

background:#ff6b35;

color:white;

border:none;

border-radius:12px;

cursor:pointer;

box-shadow:0 2px 5px rgba(0,0,0,.2);

}

.category-btn:hover{

background:#e65b28;

transform:scale(1.03);

}
body{
font-family:Tahoma,sans-serif;
margin:0;
background:#f5f5f5;
}

header{
background:#ff6b35;
color:white;
padding:15px;
font-size:24px;
font-weight:bold;
text-align:center;
}

.tabs{
display:flex;
background:white;
}

.tab{
flex:1;
padding:12px;
border:none;
cursor:pointer;
font-size:16px;
}

.active{
background:#ff6b35;
color:white;
}

.page{
display:none;
padding:15px;
}

.show{
display:block;
}

.menu-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:10px;
}

.menu-card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.15);
cursor:pointer;
text-align:center;
}

.menu-card:hover{
background:#fff0e8;
}

.cart-box{
background:white;
padding:15px;
border-radius:10px;
margin-top:15px;
}

.cart-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
border-bottom:1px solid #eee;
}

.qty-btn{
width:32px;
height:32px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

.plus{
background:#28a745;
color:white;
}

.minus{
background:#ffc107;
}

.remove{
background:red;
color:white;
margin-left:5px;
}

.main-btn{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
color:white;
margin-top:10px;
}

.save{
background:green;
}

.clear{
background:red;
}

.queue-card{
background:white;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.wait{
border-left:8px solid #ffc107;
}

.making{
border-left:8px solid orange;
}

.done{
border-left:8px solid green;
}

.status-btn{

width:100%;
padding:18px;
font-size:24px;
font-weight:bold;
background:#28a745;
color:white;
border:none;
border-radius:12px;
cursor:pointer;

}

</style>
</head>

<body>

<header>KUDSAN POS</header>

<div class="tabs">
<button class="tab active" onclick="openPage(event,'order')">รับออเดอร์</button>
<button class="tab" onclick="openPage(event,'queue')">
คิวชง
</button>

<button class="tab" onclick="openPage(event,'history')">
ประวัติ
</button>

<button class="tab" onclick="openPage(event,'dashboard')">
Dashboard
</button>
</div>

<!-- ORDER -->

<div id="order" class="page show">

<h2>เลือกเมนู</h2>

<div class="category-container">

<button
class="category-btn"
onclick="filterMenu('ทั้งหมด')">

🍹 ทั้งหมด

</button>

<button
class="category-btn"
onclick="filterMenu('ชา')">

🍵 ชา

</button>

<button
class="category-btn"
onclick="filterMenu('กาแฟ')">

☕ กาแฟ

</button>

<button
class="category-btn"
onclick="filterMenu('นม')">

🥛 นม

</button>

<button
class="category-btn"
onclick="filterMenu('มัทฉะ')">

🍵 มัทฉะ

</button>

<button
class="category-btn"
onclick="filterMenu('โกโก้')">

🍫 โกโก้

</button>

<button
class="category-btn"
onclick="filterMenu('โซดา')">

🥤 โซดา

</button>

</div>
<div class="menu-grid" id="menuGrid"></div>

<div class="cart-box">

<h3>รายการสินค้า</h3>

<div id="cart"></div>

<h2>รวม : <span id="total">0</span> บาท</h2>

<button class="main-btn save" onclick="saveOrder()">
บันทึกออเดอร์
</button>

<button class="main-btn clear" onclick="clearCart()">
ล้างรายการ
</button>

</div>

</div>

<!-- QUEUE -->

<div id="queue" class="page">
<h2>คิวชง</h2>
<div id="queueList"></div>
</div>

<!-- DASHBOARD -->

<div id="history" class="page">

<h2>ประวัติออเดอร์</h2>

<div id="historyList"></div>

</div>

<div id="dashboard" class="page">

<div class="stat">
💰 ยอดขายทั้งหมด
<h1 id="sales">0</h1>
</div>

<div class="stat">
🥤 จำนวนแก้วทั้งหมด
<h1 id="cups">0</h1>
</div>

<div class="stat">
🏆 เมนูขายดี
<div id="topMenus"></div>
</div>

</div>

<script>

const menus = [

{category:"ชา",name:"ชาดำ",price:45},
{category:"ชา",name:"ชาพีช",price:45},
{category:"ชา",name:"ชามะนาว",price:45},
{category:"ชา",name:"ชาเขียว",price:50},
{category:"ชา",name:"ชาไทย",price:50},
{category:"ชา",name:"ชาไทยใส่ชีส",price:50},
{category:"ชา",name:"ชาไทยไม่ใส่สี",price:50},

{category:"นม",name:"นมสด",price:45},
{category:"นม",name:"นมชมพู",price:45},

{category:"มัทฉะ",name:"เพียวมัจฉะ",price:50},
{category:"มัทฉะ",name:"มัทฉะลาเต้",price:55},
{category:"มัทฉะ",name:"ยูซุ Vit-C",price:50},

{category:"โกโก้",name:"โกโก้",price:55},

{category:"กาแฟ",name:"เอสเพรสโซ่",price:50},
{category:"กาแฟ",name:"อเมริกาโน่",price:50},
{category:"กาแฟ",name:"อเมริกาโน่ น้ำผึ้ง",price:50},
{category:"กาแฟ",name:"คาปูชิโน่",price:55},
{category:"กาแฟ",name:"ลาเต้",price:55},
{category:"กาแฟ",name:"มอคค่า",price:55},
{category:"กาแฟ",name:"คัดสรรเย็น",price:60},
{category:"กาแฟ",name:"คาราเมลลาเต้โกลด์",price:55},
{category:"กาแฟ",name:"คาราเมลแมคคิอาโต้",price:60},
{category:"กาแฟ",name:"ยูซุ Vit-C อเมริกาโน่",price:50},
{category:"กาแฟ",name:"เลมอนกาโน่",price:50},
{category:"กาแฟ",name:"โอเลี้ยง",price:45},
{category:"กาแฟ",name:"โอเลี้ยงยกล้อ",price:45},
{category:"กาแฟ",name:"โอเลี้ยงหางแดง",price:50},

{category:"โซดา",name:"แดงมะนาวโซดา",price:45},
{category:"โซดา",name:"น้ำผึ้งมะนาวโซดา",price:45}

];

let cart=[];

function openPage(evt,page){

document.querySelectorAll('.page').forEach(x=>{
x.classList.remove('show');
});

document.querySelectorAll('.tab').forEach(x=>{
x.classList.remove('active');
});

document.getElementById(page).classList.add('show');

if(evt){
evt.target.classList.add('active');
}

if(page==="queue")
loadQueue();

if(page==="history")
loadHistory();

if(page==="dashboard")
loadDashboard();

}

function renderMenus(menuList = menus){

let html='';

menuList.forEach(menu=>{

html+=`
<div class="menu-card"
onclick="addMenu('${menu.name}',${menu.price})">
<h3>${menu.name}</h3>
<p>${menu.price} บาท</p>
</div>
`;

});

document.getElementById('menuGrid').innerHTML=html;

}

function addMenu(name,price){

let found=cart.find(i=>i.name===name);

if(found){

found.qty++;

}else{

cart.push({
name,
price,
qty:1
});

}

renderCart();

}

function renderCart(){

let html='';
let total=0;

cart.forEach((item,index)=>{

total+=item.qty*item.price;

html+=`

<div class="cart-row">

<div>
<b>${item.name}</b><br>
${item.price} บาท
</div>

<div>

<button
class="qty-btn minus"
onclick="decreaseItem(${index})">
-
</button>

<b style="padding:0 8px;">
${item.qty}
</b>

<button
class="qty-btn plus"
onclick="increaseItem(${index})">
+
</button>

<button
class="qty-btn remove"
onclick="removeItem(${index})">
🗑
</button>

</div>

</div>

`;

});

document.getElementById('cart').innerHTML=html;
document.getElementById('total').innerText=total;

}

function increaseItem(index){

cart[index].qty++;

renderCart();

}

function decreaseItem(index){

cart[index].qty--;

if(cart[index].qty<=0){

cart.splice(index,1);

}

renderCart();

}

function removeItem(index){

if(confirm('ลบรายการ?')){

cart.splice(index,1);

renderCart();

}

}

function clearCart(){

if(confirm('ล้างทั้งหมด?')){

cart=[];

renderCart();

}

}

function saveOrder(){

if(cart.length===0){

alert('ยังไม่มีรายการ');

return;

}

let orders=
JSON.parse(
localStorage.getItem('orders')||'[]'
);

let orderNo=
"ORD-"+
String(
orders.length+1
).padStart(4,'0');

orders.push({

orderNo,
time:new Date().toLocaleString(),
status:"กำลังชง",
items:[...cart]

});

localStorage.setItem(
'orders',
JSON.stringify(orders)
);

alert("บันทึกสำเร็จ "+orderNo);

cart=[];

renderCart();

}

function loadQueue(){

let orders=
JSON.parse(
localStorage.getItem('orders')||'[]'
);

let html='';

orders.forEach((order,index)=>{

let cls='wait';

if(order.status==='กำลังชง')
cls='making';

if(order.status==='เสร็จแล้ว'){
return;
}

html += `

<div class="queue-card ${cls}">

<h3>${order.orderNo}</h3>

<div>${order.time}</div>

<br>

${order.items.map(x=>
`${x.name} x${x.qty}`
).join('<br>')}

<br><br>

<b>สถานะ :</b>
${order.status}

<br><br>

<button
class="status-btn"
onclick="nextStatus(${index})">

✅ เสร็จแล้ว

</button>

</div>

`;

});

document.getElementById('queueList').innerHTML=html;

}

function nextStatus(index){

let orders =
JSON.parse(
localStorage.getItem('orders') || '[]'
);

orders[index].status =
"เสร็จแล้ว";

localStorage.setItem(
'orders',
JSON.stringify(orders)
);

loadQueue();
loadHistory();

}

function loadDashboard(){

let orders=
JSON.parse(
localStorage.getItem('orders')||'[]'
);

let totalSales=0;
let totalCups=0;
let menuStats={};

orders.forEach(order=>{

order.items.forEach(item=>{

totalSales+=item.qty*item.price;

totalCups+=item.qty;

menuStats[item.name]=
(menuStats[item.name]||0)
+item.qty;

});

});

document.getElementById('sales').innerText=
totalSales+" บาท";

document.getElementById('cups').innerText=
totalCups+" แก้ว";

let ranking=
Object.entries(menuStats)
.sort((a,b)=>b[1]-a[1]);

let html='';

ranking.forEach(item=>{

html+=`
<div>
${item[0]} : ${item[1]} แก้ว
</div>
`;

});

document.getElementById('topMenus').innerHTML=html;

}

function filterMenu(category){

const menuList =
category === "ทั้งหมด"
? menus
: menus.filter(
m => m.category === category
);

renderMenus(menuList);

}
function loadHistory(){

let orders=
JSON.parse(
localStorage.getItem('orders') || '[]'
);

let html='';

orders
.filter(x => x.status === 'เสร็จแล้ว')
.reverse()
.forEach((order,index)=>{

html += `

<div class="queue-card">

<h3>${order.orderNo}</h3>

<p>
${order.time}
</p>

${order.items.map(item =>

`
${item.name}
x ${item.qty}
`

).join('<br>')}

<br><br>

<button
onclick="viewOrder('${order.orderNo}')">

👁 ดู

</button>

<button
onclick="restoreOrder('${order.orderNo}')">

✏️ แก้ไข

</button>

<button
onclick="deleteOrder('${order.orderNo}')">

🗑 ลบ

</button>

</div>

`;

});

document.getElementById(
'historyList'
).innerHTML =
html || '<h3>ยังไม่มีประวัติ</h3>';

}
function viewOrder(orderNo){

let orders=
JSON.parse(
localStorage.getItem('orders') || '[]'
);

let order=
orders.find(
o=>o.orderNo===orderNo
);

alert(

order.items
.map(i=>

i.name +
' x ' +
i.qty

)
.join('\n')

);

}

function restoreOrder(orderNo){

let orders=
JSON.parse(
localStorage.getItem('orders') || '[]'
);

let order=
orders.find(
o=>o.orderNo===orderNo
);

if(order){

order.status="กำลังชง";

localStorage.setItem(
'orders',
JSON.stringify(orders)
);

loadHistory();

alert('ย้ายกลับเข้าคิวชงแล้ว');

}

}

function deleteOrder(orderNo){

if(
!confirm(
'ลบออเดอร์นี้ ?'
)
){
return;
}

let orders=
JSON.parse(
localStorage.getItem('orders') || '[]'
);

orders=
orders.filter(
o=>o.orderNo!==orderNo
);

localStorage.setItem(
'orders',
JSON.stringify(orders)
);

loadHistory();

}

renderMenus();
renderCart();

</script>

</body>
</html>
