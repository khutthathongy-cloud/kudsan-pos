<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KUDSAN POS</title>

<style>

body{
font-family:Tahoma,sans-serif;
margin:0;
background:#f5f5f5;
}

header{
background:#ff6b35;
color:white;
padding:15px;
font-size:24px;
font-weight:bold;
text-align:center;
}

.tabs{
display:flex;
background:white;
}

.tab{
flex:1;
padding:12px;
border:none;
cursor:pointer;
font-size:16px;
}

.active{
background:#ff6b35;
color:white;
}

.page{
display:none;
padding:15px;
}

.show{
display:block;
}

.menu-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:10px;
}

.menu-card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.15);
cursor:pointer;
text-align:center;
}

.menu-card:hover{
background:#fff0e8;
}

.cart-box{
background:white;
padding:15px;
border-radius:10px;
margin-top:15px;
}

.cart-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
border-bottom:1px solid #eee;
}

.qty-btn{
width:32px;
height:32px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

.plus{
background:#28a745;
color:white;
}

.minus{
background:#ffc107;
}

.remove{
background:red;
color:white;
margin-left:5px;
}

.main-btn{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
color:white;
margin-top:10px;
}

.save{
background:green;
}

.clear{
background:red;
}

.queue-card{
background:white;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.wait{
border-left:8px solid #ffc107;
}

.making{
border-left:8px solid orange;
}

.done{
border-left:8px solid green;
}

.status-btn{
background:#0078d7;
color:white;
padding:8px;
border:none;
border-radius:6px;
}

.stat{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:10px;
}

</style>
</head>

<body>

<header>KUDSAN POS</header>

<div class="tabs">
<button class="tab active" onclick="openPage(event,'order')">รับออเดอร์</button>
<button class="tab" onclick="openPage(event,'queue')">คิวชง</button>
<button class="tab" onclick="openPage(event,'dashboard')">Dashboard</button>
</div>

<!-- ORDER -->

<div id="order" class="page show">

<h2>เลือกเมนู</h2>

<div style="margin-bottom:10px">

<button onclick="filterMenu('ทั้งหมด')">
ทั้งหมด
</button>

<button onclick="filterMenu('ชา')">
ชา
</button>

<button onclick="filterMenu('กาแฟ')">
กาแฟ
</button>

<button onclick="filterMenu('นม')">
นม
</button>

<button onclick="filterMenu('มัทฉะ')">
มัทฉะ
</button>

<button onclick="filterMenu('โกโก้')">
โกโก้
</button>

<button onclick="filterMenu('โซดา')">
โซดา
</button>

</div>
<div class="menu-grid" id="menuGrid"></div>

<div class="cart-box">

<h3>รายการสินค้า</h3>

<div id="cart"></div>

<h2>รวม : <span id="total">0</span> บาท</h2>

<button class="main-btn save" onclick="saveOrder()">
บันทึกออเดอร์
</button>

<button class="main-btn clear" onclick="clearCart()">
ล้างรายการ
</button>

</div>

</div>

<!-- QUEUE -->

<div id="queue" class="page">
<h2>คิวชง</h2>
<div id="queueList"></div>
</div>

<!-- DASHBOARD -->

<div id="dashboard" class="page">

<h2>Dashboard</h2>

<div class="stat">
💰 ยอดขายทั้งหมด
<h1 id="sales">0</h1>
</div>

<div class="stat">
🥤 จำนวนแก้วทั้งหมด
<h1 id="cups">0</h1>
</div>

<div class="stat">
🏆 เมนูขายดี
<div id="topMenus"></div>
</div>

</div>

<script>

const menus = [

{category:"ชา",name:"ชาดำ",price:45},
{category:"ชา",name:"ชาพีช",price:45},
{category:"ชา",name:"ชามะนาว",price:45},
{category:"ชา",name:"ชาเขียว",price:50},
{category:"ชา",name:"ชาไทย",price:50},
{category:"ชา",name:"ชาไทยใส่ชีส",price:50},
{category:"ชา",name:"Natural Thai Tea",price:50},

{category:"นม",name:"นมสด",price:45},
{category:"นม",name:"นมชมพู",price:45},

{category:"มัทฉะ",name:"Pure Matcha",price:50},
{category:"มัทฉะ",name:"Matcha Latte",price:55},
{category:"มัทฉะ",name:"Yuzu Vit-C",price:50},

{category:"โกโก้",name:"โกโก้",price:55},

{category:"กาแฟ",name:"Espresso",price:50},
{category:"กาแฟ",name:"Americano",price:50},
{category:"กาแฟ",name:"Honey Americano",price:50},
{category:"กาแฟ",name:"Cappuccino",price:55},
{category:"กาแฟ",name:"Latte",price:55},
{category:"กาแฟ",name:"Mocha",price:55},
{category:"กาแฟ",name:"Kudsan Iced Coffee",price:60},
{category:"กาแฟ",name:"Caramel Latte Gold",price:55},
{category:"กาแฟ",name:"Caramel Macchiato",price:60},
{category:"กาแฟ",name:"Yuzu Vit-C Americano",price:50},
{category:"กาแฟ",name:"Lemoncano",price:50},
{category:"กาแฟ",name:"Kopi",price:45},
{category:"กาแฟ",name:"Kopi Gold",price:45},
{category:"กาแฟ",name:"โอเลี้ยงมุกแดง",price:50},

{category:"โซดา",name:"Lime Soda",price:45},
{category:"โซดา",name:"Honey Lime Soda",price:45}

];

let cart=[];

function openPage(evt,page){

document.querySelectorAll('.page').forEach(x=>{
x.classList.remove('show');
});

document.querySelectorAll('.tab').forEach(x=>{
x.classList.remove('active');
});

document.getElementById(page).classList.add('show');
evt.target.classList.add('active');

if(page==="queue") loadQueue();
if(page==="dashboard") loadDashboard();

}

function renderMenus(menuList = menus){

let html='';

menuList.forEach(menu=>{

html+=`
<div class="menu-card"
onclick="addMenu('${menu.name}',${menu.price})">
<h3>${menu.name}</h3>
<p>${menu.price} บาท</p>
</div>
`;

});

document.getElementById('menuGrid').innerHTML=html;

}

function addMenu(name,price){

let found=cart.find(i=>i.name===name);

if(found){

found.qty++;

}else{

cart.push({
name,
price,
qty:1
});

}

renderCart();

}

function renderCart(){

let html='';
let total=0;

cart.forEach((item,index)=>{

total+=item.qty*item.price;

html+=`

<div class="cart-row">

<div>
<b>${item.name}</b><br>
${item.price} บาท
</div>

<div>

<button
class="qty-btn minus"
onclick="decreaseItem(${index})">
-
</button>

<b style="padding:0 8px;">
${item.qty}
</b>

<button
class="qty-btn plus"
onclick="increaseItem(${index})">
+
</button>

<button
class="qty-btn remove"
onclick="removeItem(${index})">
🗑
</button>

</div>

</div>

`;

});

document.getElementById('cart').innerHTML=html;
document.getElementById('total').innerText=total;

}

function increaseItem(index){

cart[index].qty++;

renderCart();

}

function decreaseItem(index){

cart[index].qty--;

if(cart[index].qty<=0){

cart.splice(index,1);

}

renderCart();

}

function removeItem(index){

if(confirm('ลบรายการ?')){

cart.splice(index,1);

renderCart();

}

}

function clearCart(){

if(confirm('ล้างทั้งหมด?')){

cart=[];

renderCart();

}

}

function saveOrder(){

if(cart.length===0){

alert('ยังไม่มีรายการ');

return;

}

let orders=
JSON.parse(
localStorage.getItem('orders')||'[]'
);

let orderNo=
"ORD-"+
String(
orders.length+1
).padStart(4,'0');

orders.push({

orderNo,
time:new Date().toLocaleString(),
status:"รอชง",
items:[...cart]

});

localStorage.setItem(
'orders',
JSON.stringify(orders)
);

alert("บันทึกสำเร็จ "+orderNo);

cart=[];

renderCart();

}

function loadQueue(){

let orders=
JSON.parse(
localStorage.getItem('orders')||'[]'
);

let html='';

orders.forEach((order,index)=>{

let cls='wait';

if(order.status==='กำลังชง')
cls='making';

if(order.status==='เสร็จแล้ว')
cls='done';

html+=`

<div class="queue-card ${cls}">

<h3>${order.orderNo}</h3>

<div>${order.time}</div>

<br>

${order.items.map(x=>
`${x.name} x${x.qty}`
).join('<br>')}

<br><br>

<b>สถานะ :</b>
${order.status}

<br><br>

<button
class="status-btn"
onclick="nextStatus(${index})">

เปลี่ยนสถานะ

</button>

</div>

`;

});

document.getElementById('queueList').innerHTML=html;

}

function nextStatus(index){

let orders=
JSON.parse(
localStorage.getItem('orders')||'[]'
);

if(orders[index].status==="รอชง"){

orders[index].status="กำลังชง";

}else if(orders[index].status==="กำลังชง"){

orders[index].status="เสร็จแล้ว";

}

localStorage.setItem(
'orders',
JSON.stringify(orders)
);

loadQueue();

}

function loadDashboard(){

let orders=
JSON.parse(
localStorage.getItem('orders')||'[]'
);

let totalSales=0;
let totalCups=0;
let menuStats={};

orders.forEach(order=>{

order.items.forEach(item=>{

totalSales+=item.qty*item.price;

totalCups+=item.qty;

menuStats[item.name]=
(menuStats[item.name]||0)
+item.qty;

});

});

document.getElementById('sales').innerText=
totalSales+" บาท";

document.getElementById('cups').innerText=
totalCups+" แก้ว";

let ranking=
Object.entries(menuStats)
.sort((a,b)=>b[1]-a[1]);

let html='';

ranking.forEach(item=>{

html+=`
<div>
${item[0]} : ${item[1]} แก้ว
</div>
`;

});

document.getElementById('topMenus').innerHTML=html;

}

function filterMenu(category){

const menuList =
category === "ทั้งหมด"
? menus
: menus.filter(
m => m.category === category
);

renderMenus(menuList);

}
renderMenus();
renderCart();

</script>

</body>
</html>
